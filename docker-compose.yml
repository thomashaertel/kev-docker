services:
  kev:
    build:
      context: .
      dockerfile: Dockerfile
    image: kev-rocm:local
    restart: unless-stopped

    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri

    group_add:
      - video
      - render

    ipc: host

    ports:
      - "${KEV_HOST:-127.0.0.1}:${KEV_PORT:-8009}:8009"

    environment:
      HF_HOME: /cache/huggingface
      KEV_API_KEY: "${KEV_API_KEY:-}"

    volumes:
      - ./volumes/huggingface-cache:/cache/huggingface

    # Overrides the Dockerfile CMD — all args are passed through to "$@"
    # in entrypoint.sh, which hands them straight to python3.
    command:
      - python3
      - -m
      - kev.serve
      - --device
      - cuda
      - --host
      - "0.0.0.0"
      - --port
      - "8009"
      - --run
      - "${KEV_MODEL:-jaredpalmer/kev-4b}"

volumes:
  huggingface-cache:
